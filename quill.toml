# A Quill for Cloudmorrow. Everything it is, is declared here: the data it
# uses, the screens it shows, the jobs it runs. The screens are drawn on the
# phone, the web app and the terminal by Cloudmorrow itself — there is no UI
# code to write. See CLAUDE.md for the whole format, and run `cm quill check`.

[quill]
id = "example"
name = "Example"
version = "0.1.0"
summary = "One line on what this Quill is for."
category = "personal"          # personal, home, business, developer
icon = "example"
publisher = ""
license = "MIT"

[uses]
datamodels = []                # foundational datamodels: task, contact, vehicle, …

[[screens]]
id = "items"
kit = "list"
label = "Example"
model = "example.item"
title = "name"
tick = "done"
